<li class="wjs-submission-form__form-review-list-item">
  <span>{{ label|safe }}</span>
  {% if kind == "check" %}
    {% if answer == "True" or answer == True %}
      <span class="ms-2 d-inline-flex align-items-center">
              <i class="bi bi-check text-success" aria-hidden="true"></i>
            </span>
    {% else %}
      <span class="ms-2 d-inline-flex align-items-center">
              <i class="bi bi-x text-danger" aria-hidden="true"></i>
            </span>
    {% endif %}
  {% elif kind == "text" %}
    <span class="ms-2 d-inline-flex align-items-center">
            {{ answer }}
          </span>
  {% endif %}
</li>
