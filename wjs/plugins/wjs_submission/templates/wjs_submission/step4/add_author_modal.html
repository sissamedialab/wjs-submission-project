{% load django_bootstrap5 static field %}
<div class="modal-header">
  <h2 class="modal-title" id="htmxModalLabel">New Author</h2>
  {% bootstrap_button button_class="btn-close" data_bs_dismiss="modal" button_type="button" aria_label="Close" content="" %}
</div>
<div class="modal-body">
  <form method="post" action="" class="wjs-submission-form" enctype="multipart/form-data" hx-post="{% url 'add-author' %}"  hx-vals='{"article_id": "{{ article_id }}"}' hx-target="#selected-authors-wrapper">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add author" %}
  </form>
</div>
