{% extends "wjs_submission/base.html" %}
{% load i18n %}

{% block title %}Cannot start {{ correction_label }} submission{% endblock title %}

{% block content %}
  <div class="col-sm-12">
    <div class="wjs-submission-container">
      <div class="wjs-submission-form__section mb-5">
        <div class="wjs-submission-form__section-content">
          <p>{{ error }}</p>
          {% if article_id %}
            <p>
              <a href="{% url 'wjs_article_details_from_id' article_id %}" class="button">
                {% trans "Back to article" %}
              </a>
            </p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
