<div id="selected-funding-wrapper">
  <div class="wjs-submission-form__section mb-5 {% if not articles_funding.exists %}d-none{% endif %}">
    <div class="wjs-submission-form__section-content">
      <table class="table table-sm" id="funding-table">
        <thead>
        <tr>
          <th width="30%">Name</th>
          <th width="25%">DOI</th>
          <th width="15%">Country</th>
          <th width="30%">Grant / award number</th>
          <th class="text-center">Edit</th>
          <th class="text-end">Delete</th>
        </tr>
        </thead>
        <tbody>
        {% for funding in articles_funding %}
          {% if forloop.first %}
            <input type="hidden" name="funding_id" id="id_funding_id" value="{{ funding.pk }}"
                   hx-get="{{ add_funding_url }}"
                   hx-trigger="change"
                   hx-swap="innerHTML"
                   hx-target="#htmxModalContent"
                   hx-vals='{"article_id": "{{ article.pk }}"}'
            >
          {% endif %}
          <tr>
            <td>{{ funding.name }}</td>
            <td>{{ funding.fundref_id|default:"-" }}</td>
            <td>{{ funding.country|default:"-" }}</td>
            <td>{{ funding.funding_id|default:"-" }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-primary"
                      hx-get="{{ add_funding_url }}"
                      hx-target="#htmxModalContent"
                      hx-vals='{"article_id": "{{ article.pk }}", "funding_pk": "{{ funding.pk }}"}'>
                <i class="bi bi-pencil"></i>
              </button>
            </td>
            <td class="text-end">
              <button class="btn btn-sm"
                      hx-post="{{ delete_funding_url }}"
                      hx-vals='{"article_id": "{{ article.pk }}", "funding_pk": "{{ funding.pk }}"}'
                      hx-target="#selected-funding-wrapper"
                      hx-swap="innerHTML">
                <i class="bi bi-trash3"></i>
              </button>
            </td>
          </tr>
        {% empty %}
          <input type="hidden" name="funding_id" id="id_funding_id"
                 hx-get="{{ add_funding_url }}"
                 hx-trigger="change"
                 hx-swap="innerHTML"
                 hx-target="#htmxModalContent"
                 hx-vals='{"article_id": "{{ article.pk }}"}'
          >
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
