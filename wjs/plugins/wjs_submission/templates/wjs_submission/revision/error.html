{% extends "wjs_submission/base.html" %}
{% load django_bootstrap5 static %}

{% block submission_flow %}
  <div class="wjs-submission-form__section mb-5">
    <h2 class="wjs-submission-form__form-label-title ">Revision not available</h2>
    <div class="wjs-submission-form__section-content">
      {{ error|safe }}
    </div>
  </div>
{% endblock submission_flow %}
{% block submission_footer %}
    <div class="wjs-submission-form__footer">
      <div class="wjs-submission-form__footer-button d-flex justify-content-between align-items-center">
        <a href="{% url 'wjs_submission_0' article_id=article_id %}" class="btn btn-secondary" id="back-btn">Back</a>
      </div>
    </div>
{% endblock submission_footer %}
