{% load submission_tags %}
<div class="wjs-submission-navigation">
  {% for step_state in steps.values %}
    {% if step_state.state %}
      <div
        class="wjs-submission-navigation-step{% if step_state.step == step %} wjs-submission-navigation-step--current{% endif %}{% if step_state.available %} wjs-submission-navigation-step--done{% endif %}">
        {% if step_state.step.step_number > 1 %}
          <div class="wjs-submission-navigation-step__line"></div>{% endif %}
        <a {% if step_state.available and article %}href="{% url step_state.step.step_view_name article.pk %}"
           {% else %}href="#"{% endif %}
           class="wjs-submission-navigation-step__link">
          <div class="wjs-submission-navigation-step__circle"><i class="bi {{ step_state.step.icon }}"></i></div>
          <div class="wjs-submission-navigation-step__label">{{ step_state.step|step_title:article }}</div>
        </a>
      </div>
    {% endif %}
  {% endfor %}
</div>
