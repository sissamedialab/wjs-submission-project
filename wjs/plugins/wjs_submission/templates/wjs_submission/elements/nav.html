<div class="wjs-submission-navigation">
  {% for step_state in steps.values %}
    <div
      class="wjs-submission-navigation-step {% if step_state.step.step_number <= step.step_number %}wjs-submission-navigation-step--active{% endif %}">
      {% if step_state.step.step_number > 1 %}
        <div class="wjs-submission-navigation-step__line"></div>{% endif %}
      <a {% if article %}href="{% url step_state.step.step_view_name article.pk %}"{% else %}href="#"{% endif %}
         class="wjs-submission-navigation-step__link">
        <div class="wjs-submission-navigation-step__circle"><i class="bi {{ step_state.step.icon }}"></i></div>
        <div class="wjs-submission-navigation-step__label">{{ step_state.step.label }}</div>
      </a>
    </div>
  {% endfor %}
</div>
